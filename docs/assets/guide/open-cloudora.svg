</g><text x="60" y="75" font-size="17" fill="#15171b" font-weight="700">Cloudora</text><rect x="26" y="98" width="268" height="126" rx="10" fill="#fff" stroke="#e1e4e9" stroke-width="1" /><rect x="36" y="106" width="26" height="26" rx="6" fill="#eef0f3" /><path d="M42 116 v8.5 a1.5 1.5 0 0 0 1.5 1.5 h8.5" fill="none" stroke="#c23636" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><rect x="45" y="112" width="11" height="11" rx="1.5" fill="none" stroke="#c23636" stroke-width="1.4" /><text x="50.5" y="119.6" font-size="4.2" fill="#c23636" font-weight="800" text-anchor="middle">PDF</text><text x="74" y="117" font-size="12.5" fill="#15171b" font-weight="600">Dawit Beyene CV.pdf</text><text x="74" y="132" font-size="10.5" fill="#5a6170">240 KB</text><rect x="74" y="140" width="220" height="1" fill="#e1e4e9" /><rect x="36" y="148" width="26" height="26" rx="6" fill="#eef0f3" /><rect x="42" y="154" width="14" height="14" rx="2" fill="none" stroke="#7353c9" stroke-width="1.5" /><path d="M44.5 165 l3 -4 l2 2.5 l2.5 -3.5 l3.5 5 z" fill="#7353c9" /><text x="74" y="159" font-size="12.5" fill="#15171b" font-weight="600">Irreecha 2026.jpg</text><text x="74" y="174" font-size="10.5" fill="#5a6170">4.2 MB</text><rect x="74" y="182" width="220" height="1" fill="#e1e4e9" /><rect x="36" y="190" width="26" height="26" rx="6" fill="#eef0f3" /><rect x="41.5" y="197.5" width="15" height="12" rx="1.5" fill="none" stroke="#c4435f" stroke-width="1.5" /><rect x="41.5" y="201.5" width="15" height="1.5" fill="#c4435f" /><path d="M46 197.5 l-1.5 4 M50 197.5 l-1.5 4 M54 197.5 l-1.5 4" fill="none" stroke="#c4435f" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><text x="74" y="201" font-size="12.5" fill="#15171b" font-weight="600">The Ten Commandments 4K.mp4</text><text x="74" y="216" font-size="10.5" fill="#5a6170">4.8 GB, stored as 10 parts</text><text x="26" y="262" font-size="22" fill="#15171b" font-weight="700">Your files, kept in</text><text x="26" y="288" font-size="22" fill="#15171b" font-weight="700">your own Telegram.</text><text x="26" y="310" font-size="11" fill="#5a6170">Cloudora stores everything in a private</text><text x="26" y="325" font-size="11" fill="#5a6170">channel on your account and gives you a proper</text><text x="26" y="340" font-size="11" fill="#5a6170">file manager and photo backup on top. There</text><text x="26" y="355" font-size="11" fill="#5a6170">are no Cloudora servers, and files bigger</text><text x="26" y="370" font-size="11" fill="#5a6170">than Telegram’s limit are split for you.</text><rect x="26" y="382" width="268" height="40" rx="10" fill="#2356E0" /><text x="160" y="407" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">Sign in with Telegram</text><text x="26" y="442" font-size="10.5" fill="#868d9a">Independent app, not affiliated with Telegram.</text></g></g>
